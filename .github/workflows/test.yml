name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

# New pushes to a PR cancel its older run. Every other run gets its own group,
# so runs on main are never cancelled or dropped while pending.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download

      - name: Run Go linter
        run: make lint-golangci

      - name: Install Terraform CLI
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
          terraform_version: v1.17.1

      - name: Run Terraform linter on examples and playground
        run: terraform fmt -recursive -check -diff ./examples ./playground

      - name: Run sh linter on examples
        run: make lint-examples-sh

      - name: Run actionlint on workflows
        run: make lint-actionlint

      - name: Read zizmor version from Makefile
        id: zizmor
        run: echo "version=$(make -s zizmor-version)" >> "$GITHUB_OUTPUT"

      - name: Run zizmor on workflows
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: ${{ steps.zizmor.outputs.version }}
          advanced-security: false
          annotations: true

      # Same check as `make lint-links`: version, file list and lychee.toml
      # all come from the repository, so CI and local runs agree.
      - name: Read lychee version from Makefile
        id: lychee
        run: echo "version=$(make -s lychee-version)" >> "$GITHUB_OUTPUT"

      - name: Check Markdown links offline
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: ${{ steps.lychee.outputs.version }}
          args: --config lychee.toml $(make -s lint-links-files)
          jobSummary: false

      - name: Fail if docs are not up to date
        run: make lint-generated

  build:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # renovate: datasource=github-releases depName=goreleaser/goreleaser
      GORELEASER_VERSION: v2.19.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The snapshot build only checks that GoReleaser succeeds; its artifacts
      # are never published, so the build cache cannot reach a release.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 # zizmor: ignore[cache-poisoning]
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --snapshot --skip sign

  test-unit:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: make test
        timeout-minutes: 10

  # Connection settings come from the Makefile defaults, which match the
  # local stack in run/, so CI runs exactly what contributors run locally.
  test-acceptance:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # we currently support the last 3 patchs within a minor
        lakekeeper-version:
          - 'latest-main'
          - 'v0.10.4'
          - 'v0.10.3'
          - 'v0.10.2'
    env:
      LAKEKEEPER_VERSION: ${{ matrix.lakekeeper-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: v1.17.1
          terraform_wrapper: false
      - run: go mod download
      - name: Start Lakekeeper
        run: make testacc-up
      - run: make testacc
        timeout-minutes: 10

  # Single stable check for the "Protect main" ruleset: it passes only if
  # every job above succeeded, so jobs and matrix entries can change without
  # touching the ruleset.
  ci-ok:
    if: always()
    needs:
      - lint
      - build
      - test-unit
      - test-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check that all jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
