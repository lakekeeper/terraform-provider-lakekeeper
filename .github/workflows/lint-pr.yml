name: Lint Pull Request

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - labeled
      - unlabeled
      
permissions:
    contents: read
    pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: thehanimo/pr-title-checker@b69bc3a841cf4e3cfef2d822625d8c90a588e9da # v2.0.0
        id: check
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          configuration_path: ".github/pr-title-checker-config.json"
          pass_on_octokit_error: false

      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: ${{ steps.check.outputs.success == 'false'}}
        with:
          header: 'pr-title-checker'
          recreate: true
          message: |
              ### 🚨 PR Title Needs Formatting
              The title of this PR needs to be formatted correctly. 
              Please update the title to match the [conventional commits](https://www.conventionalcommits.org) format. Examples:
              
              * `feat: feature description`
              * `fix: what was fixed`
              * `docs: documentation`
              * `chore(deps): update dependencies`

              Allowed types: `build`, `chore`, `ci`, `docs`, `feat`, `fix`, `perf`, `refactor`, `revert`, `style`, `test`.
      
      - if: ${{ steps.check.outputs.success == 'false'}}
        name: Fail on invalid title
        run: exit 1

  labeler:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
         sync-labels: 'true'
      - name: Set breaking change
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ./.github/pull-request-triage.sh
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: ${{ steps.check.outputs.breaking_change == 'true'}}
        with:
          header: 'breaking-change'
          recreate: true
          message: |
              ### ⚠️ **You are introducing a breaking change**
        
              This pull request includes one or more **breaking changes**.

              Please ensure the following brefore merging:

              - [ ] Update the relevant documentation and examples (`examples/`, `playground/`)
              - [ ] Details on this change should be added to the PR body
              - [ ] Add migration instructions if necessary
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: ${{ steps.check.outputs.breaking_change == 'false'}}
        with:
          header: 'breaking-change'
          delete: true
